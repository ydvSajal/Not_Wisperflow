<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Not Wisperflow — free, local-first dictation</title>
<meta name="description" content="Free, open-source voice dictation for Windows, macOS and Linux. Local Whisper transcription, one hotkey, zero subscriptions." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23151310'/%3E%3Cpath d='M9 21V11l14 10V11' stroke='%23e9e4d8' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#f7f3e6;
    --ink:#181510;
    --dim:#6b6355;
    --card:#fdfbf3;
    --border:#e6dfc9;
    --accent:#dcd2f5;
    --accent-ink:#181510;
    --ribbon:#171410;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow-x:hidden;
  }
  .serif{ font-family:"Fraunces", Georgia, serif; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }

  header{ display:flex; justify-content:center; padding:20px 20px 0; position:relative; z-index:20; }
  .nav{
    display:flex; align-items:center; gap:22px;
    background:var(--card); border:1px solid var(--border); border-radius:18px;
    padding:9px 12px 9px 16px; box-shadow:0 10px 30px -18px rgba(20,16,8,.35);
    max-width:100%;
  }
  .brand{ display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px; text-decoration:none; color:var(--ink); }
  .brand .mark{ width:22px; height:22px; border-radius:6px; background:var(--ink); display:flex; align-items:center; justify-content:center; flex:none; }
  .brand .mark svg{ width:13px; height:13px; }
  .nav-links{ display:flex; align-items:center; gap:20px; margin-left:6px; }
  .nav-links a{ color:var(--dim); text-decoration:none; font-size:13.5px; }
  .nav-links a:hover{ color:var(--ink); }
  .cta{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--accent); color:var(--accent-ink);
    padding:9px 16px; border-radius:11px; font-size:13.5px; font-weight:600;
    border:none; cursor:pointer; white-space:nowrap; font-family:inherit;
    transition:transform .15s ease, filter .15s ease;
  }
  .cta:hover{ filter:brightness(0.97); }
  .cta:active{ transform:scale(.97); }
  .cta svg{ width:13px; height:13px; flex:none; }
  @media (max-width:720px){ .nav-links{ display:none; } }

  main{ position:relative; min-height:100dvh; padding-bottom:120px; }

  .hero{ position:relative; z-index:5; padding:96px 24px 0; text-align:center; }
  .eyebrow{ font-size:12px; letter-spacing:.14em; color:var(--dim); margin:0 0 22px; }
  h1{ margin:0; font-weight:400; line-height:1.04; font-size:clamp(40px,7vw,68px); }
  h1 em{ font-style:italic; font-weight:500; }
  .lead{ margin:26px auto 0; max-width:44ch; color:var(--dim); font-size:17px; line-height:1.5; }
  .actions{ margin-top:30px; display:flex; justify-content:center; }
  .hero .cta{ padding:13px 22px; font-size:14.5px; border-radius:12px; }
  .avail{ margin-top:16px; font-size:12.5px; color:var(--dim); }
  #dl-status.err{ color:#a3432b; }

  /* looping script line, top-left */
  .loop-field{ position:absolute; top:80px; left:-60px; width:640px; height:640px; z-index:1; pointer-events:none; opacity:.75; }
  .loop-field text{ fill:var(--dim); font-size:15px; }

  /* ribbon field, lower half */
  .ribbon-field{ position:absolute; left:0; right:0; bottom:60px; height:260px; z-index:2; pointer-events:none; }
  .ribbon-field svg{ width:100%; height:100%; overflow:visible; }
  .ribbon-path{ fill:none; stroke:var(--ribbon); stroke-width:78; stroke-linecap:round; }
  .ribbon-field text{ fill:#f2eee0; font-size:16px; }
  .ribbon-field .mono-t{ font-family:"IBM Plex Mono", monospace; letter-spacing:.01em; }

  .rec-dot{ position:absolute; left:calc(50% - 3px); bottom:330px; width:6px; height:6px; border-radius:50%; background:#8a8367; z-index:3; animation:pulse 2.2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:.35; transform:scale(1);} 50%{ opacity:1; transform:scale(1.5);} }

  .waveform-pill{ position:absolute; z-index:4; display:flex; align-items:center; gap:2px; height:38px; }
  .waveform-pill i{ width:2.5px; background:#f2eee0; border-radius:2px; flex:none; animation:wave 1.4s ease-in-out infinite; }
  @keyframes wave{ 0%,100%{ transform:scaleY(.3);} 50%{ transform:scaleY(1);} }

  @media (prefers-reduced-motion: reduce){
    .rec-dot, .waveform-pill i{ animation:none; }
  }

  @media (max-width: 860px){
    .loop-field{ width:380px; height:380px; left:-120px; top:40px; opacity:.5; }
    .ribbon-field{ height:160px; bottom:30px; }
    .ribbon-path{ stroke-width:52; }
    .ribbon-field text{ font-size:12px; }
    .hero{ padding-top:60px; }
  }
</style>
</head>
<body>

<header>
  <nav class="nav">
    <a class="brand" href="#top">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M6 16V8l12 8V8" stroke="#f7f3e6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Not Wisperflow
    </a>
    <div class="nav-links">
      <a href="https://github.com/ydvSajal/Not_Wisperflow">Source</a>
      <a href="https://github.com/ydvSajal/Not_Wisperflow/releases">Releases</a>
      <a href="https://github.com/ydvSajal/Not_Wisperflow/discussions">Community</a>
    </div>
    <button class="cta" id="nav-download">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/></svg>
      Get started on Windows
    </button>
  </nav>
</header>

<main id="top">

  <svg class="loop-field" viewBox="0 0 640 640" aria-hidden="true">
    <path id="loopPath" d="M 40 620
      C 20 480, 30 300, 150 220
      C 260 148, 400 170, 430 280
      C 458 380, 360 440, 280 400
      C 210 366, 220 300, 290 290" fill="none"/>
    <text class="mono">
      <textPath href="#loopPath" startOffset="0%">the meeting moved to thursday, and i still owe the vendor a reply about that invoice mismatch before end of day</textPath>
    </text>
  </svg>

  <div class="hero">
    <p class="eyebrow mono">NOT WISPERFLOW DICTATION</p>
    <h1 class="serif">Stop typing,<br><em>start talking.</em></h1>
    <p class="lead">Local voice-to-text that turns speech into clean, punctuated text in any app. Offline by default, free, no account.</p>
    <div class="actions">
      <button class="cta" id="hero-download">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/></svg>
        Get started on Windows
      </button>
    </div>
    <p class="avail" id="dl-status">Also builds from source on macOS and Linux</p>
  </div>

  <span class="rec-dot" aria-hidden="true"></span>

  <div class="ribbon-field" aria-hidden="true">
    <svg viewBox="0 0 1400 260" preserveAspectRatio="xMidYMid meet">
      <path id="ribbonPath" class="ribbon-path" d="M 130 190
        C 340 190, 380 90, 620 110
        C 830 128, 900 40, 1150 40
        C 1300 40, 1360 20, 1440 -10" />
      <text class="mono-t">
        <textPath id="ribbonText" href="#ribbonPath" startOffset="16%">there has been a lot of back and forth, and honestly the whole thing has been a little chaotic since the scope changed twice</textPath>
      </text>
    </svg>
    <div class="waveform-pill" id="pillWave" style="left:74px; bottom:52px;"></div>
  </div>

</main>

<script>
(function(){
  var REPO = 'ydvSajal/Not_Wisperflow';
  var status = document.getElementById('dl-status');

  function startDownload(){
    status.classList.remove('err');
    status.textContent = 'Finding the latest build...';
    fetch('https://api.github.com/repos/' + REPO + '/releases/latest')
      .then(function(r){ if(!r.ok) throw new Error('bad response'); return r.json(); })
      .then(function(data){
        var asset = (data.assets || []).find(function(a){ return /Setup\.exe$/i.test(a.name); });
        if(!asset) throw new Error('no windows asset');
        status.innerHTML = 'Downloading ' + data.tag_name + '&hellip;';
        window.location.href = asset.browser_download_url;
        setTimeout(function(){
          status.textContent = 'Also builds from source on macOS and Linux';
        }, 1200);
      })
      .catch(function(){
        status.classList.add('err');
        status.textContent = 'Could not reach GitHub, opening the releases page instead.';
        window.location.href = 'https://github.com/' + REPO + '/releases/latest';
      });
  }
  document.getElementById('hero-download').addEventListener('click', startDownload);
  document.getElementById('nav-download').addEventListener('click', startDownload);

  var pill = document.getElementById('pillWave');
  for(var i=0;i<11;i++){
    var bar = document.createElement('i');
    bar.style.height = (10 + Math.random()*20) + 'px';
    bar.style.animationDelay = (i*0.06)+'s';
    pill.appendChild(bar);
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ribbonText = document.getElementById('ribbonText');
  var offset = 16;
  if(!reduce){
    (function tick(){
      offset -= 0.045;
      if(offset < -120) offset = 20;
      ribbonText.setAttribute('startOffset', offset + '%');
      requestAnimationFrame(tick);
    })();
  }
})();
</script>

</body>
</html>
