appId: com.sajal.notwhisprflow
productName: NotWhisperFlow
copyright: Copyright (c) 2026 Sajal Kumar
directories:
  output: release
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
  # onnxruntime-node ships prebuilt bindings for six platforms (~208 MB) and
  # loads exactly one at runtime: bin/napi-v3/<platform>/<arch>. Drop the rest.
  - '!node_modules/onnxruntime-node/bin/napi-v3/darwin'
  - '!node_modules/onnxruntime-node/bin/napi-v3/linux'
  - '!node_modules/onnxruntime-node/bin/napi-v3/win32/arm64'
  # transformers pulls in onnxruntime-web (89 MB) for its browser backend. We
  # only ever run the node build, which webpack marks that import as "(ignored)"
  # in — verify with: grep -n 'onnxruntime-web (ignored)' on transformers.node.mjs
  # before assuming this is still safe after a dependency bump.
  - '!node_modules/onnxruntime-web'
  # Same story for the WASM execution provider shipped inside transformers/dist.
  - '!node_modules/@huggingface/transformers/dist/*.wasm'
  - '!node_modules/@huggingface/transformers/dist/*.min.js'
  - '!node_modules/@huggingface/transformers/dist/transformers.web*'
  - '!node_modules/**/*.map'
# Personal app: skip asar so worker threads and ONNX runtime resolve modules
# from a plain directory with zero path tricks.
asar: false
# All native deps (onnxruntime-node, sharp) ship prebuilt N-API binaries.
npmRebuild: false
win:
  target: nsis
  # electron-builder converts this 256x256 PNG into the multi-size .ico that
  # Windows uses for the exe, Start menu, taskbar and Add/Remove Programs.
  icon: build/icon.png
  artifactName: ${productName}-${version}-Setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Per-user install: lands in %LOCALAPPDATA%, so no admin prompt is needed.
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NotWhisperFlow
  uninstallDisplayName: NotWhisperFlow ${version}
  # Launch straight after installing so the tray icon and hotkey are live.
  runAfterFinish: true
mac:
  target: dmg
  icon: build/icon.png
linux:
  target: AppImage
  icon: build/icon.png
  category: Utility
